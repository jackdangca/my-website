$kind: http-request
name: Update User
method: PUT
url: '{{baseUrl}}/api/users/{{userId}}'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated Name",
      "email": "updated@example.com"
    }
