$kind: http-request
name: Login User
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 2000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "john@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res.success && res.token) {
        pm.collectionVariables.set('authToken', res.token);
        if (res.data && res.data._id) {
          pm.collectionVariables.set('userId', res.data._id);
        }
        console.log('authToken saved:', res.token.substring(0, 20) + '...');
      }
