$kind: http-request
name: Update Project
method: PUT
url: '{{baseUrl}}/api/projects/{{projectId}}'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "id": "my-new-project",
      "title": "My Updated Project",
      "completionDate": "2024-06-30",
      "image": "/images/project-new.jpg",
      "alt": "Screenshot of My Updated Project",
      "role": "Full Stack Developer",
      "description": "An updated description of the project.",
      "techStack": ["React", "Node.js", "MongoDB", "Express"],
      "outcome": "Successfully updated the project."
    }
