$kind: http-request
name: Create Project
method: POST
url: '{{baseUrl}}/api/projects'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "id": "my-new-project",
      "title": "My New Project",
      "completionDate": "2024-06-30",
      "image": "/images/project-new.jpg",
      "alt": "Screenshot of My New Project",
      "role": "Full Stack Developer",
      "description": "A detailed description of the project and what it does.",
      "techStack": ["React", "Node.js", "MongoDB"],
      "outcome": "Successfully delivered the project on time."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res.success && res.data && res.data._id) {
        pm.collectionVariables.set('projectId', res.data.id || res.data._id);
        console.log('projectId saved:', pm.collectionVariables.get('projectId'));
      }
