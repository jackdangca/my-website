$kind: http-request
method: POST
url: '{{baseUrl}}/api/contacts'
order: 3000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Jane",
      "lastName": "Smith",
      "email": "jane@example.com",
      "phone": "0412345678",
      "message": "Hello, I would like to get in touch!"
    }
